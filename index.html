<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyBite</title>
<meta name="apple-mobile-web-app-title" content="DailyBite">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8b5a2b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f7f3ee;--card:#fffdfa;--text:#2b2118;--muted:#7a6c5d;--line:#e8dfd4;--accent:#8b5a2b;--on:#fff;--good:#16a34a;--bad:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17120e;--card:#211a14;--text:#f1e9df;--muted:#b0a190;--line:#3a2f26;--accent:#d2a679;--on:#1a120b;--good:#4ade80;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{flex:1;width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.ghost{background:transparent;color:var(--muted);padding:4px 8px;font-weight:400}
button.u{text-decoration:underline}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.f{flex:1 1 80px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--muted)}
svg{width:100%;height:auto;display:block}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.d{color:var(--muted);font-size:13px}.s{font-size:12px;color:var(--muted)}.r{display:flex;align-items:center;flex:none}
.up{color:var(--bad)}.down{color:var(--good)}
.empty{color:var(--muted);text-align:center;padding:12px}
.meal h3{font-size:15px;margin:12px 0 4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:3px}
#scan{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff}
#scan[hidden]{display:none}
#vid{width:100%;max-width:420px;border-radius:12px;background:#000}
#msg{min-height:20px;margin:8px 0 0}
[hidden]{display:none!important}
#title{font-family:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:28px;letter-spacing:.4px;color:var(--accent);line-height:1.1}
#done{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<main>
<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:12px">
  <h1 id="title" style="min-width:0">DailyBite</h1>
  <button id="gear" aria-label="Settings" title="Settings" style="background:transparent;color:var(--accent);padding:6px;flex:none;line-height:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button id="back" class="alt" style="padding:6px 12px;flex:none" hidden>Done</button>
</div>

<div class="card">
  <div class="row">
    <div class="f"><label for="date">Date</label><input id="date" type="date"></div>
    <div class="f"><label for="wt">Weight (lb)</label><input id="wt" type="number" inputmode="decimal" step="0.1" placeholder="0.0"></div>
  </div>
  <div class="row" style="margin-top:10px"><button id="addw" style="flex:1">Save weight</button></div>
</div>

<div class="card stats" id="stats"></div>
<div class="card"><div id="chart"></div></div>

<div class="card">
  <div class="row">
    <div class="f"><label for="mdate">Meals for</label><input id="mdate" type="date"></div>
    <div class="f"><label for="meal">Meal</label><select id="meal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select></div>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="fname" list="known" placeholder="Food name" style="flex:1 1 100%">
    <div class="f"><label for="fcal">kcal</label><input id="fcal" type="number" inputmode="decimal"></div>
    <div class="f"><label for="fp">Protein g</label><input id="fp" type="number" inputmode="decimal"></div>
    <div class="f"><label for="fc">Carbs g</label><input id="fc" type="number" inputmode="decimal"></div>
    <div class="f"><label for="ff">Fat g</label><input id="ff" type="number" inputmode="decimal"></div>
    <div class="f"><label for="fqty">Servings</label><input id="fqty" type="number" inputmode="decimal" step="0.25" value="1"></div>
  </div>
  <datalist id="known"></datalist>
  <div class="row" style="margin-top:10px"><button id="add" style="flex:1">Add food</button><button id="scanbtn" class="alt" style="flex:1">Scan barcode</button></div>
  <div class="row" style="margin-top:8px"><button id="copy" class="alt" style="flex:1">Copy previous day</button></div>
  <div class="row" style="margin-top:8px"><button id="recentBtn" class="alt" style="flex:1">Recent foods</button></div>
  <div id="msg" class="d"></div>
  <div id="meals"></div>
  <button id="dayDone" style="width:100%;margin-top:14px">Done for the day</button>
</div>

<div class="card" id="trends"></div>

<div class="card"><ul id="list"></ul></div>

<div class="card">
  <div class="meal" style="margin:0"><h3 style="margin-top:0">Settings</h3></div>
  <div class="d" style="margin-bottom:8px">Macro goals are calculated from your calorie goal using the split below. Type grams in a goal field to override it.</div>
  <div class="row" style="margin-bottom:10px">
    <div class="f"><label for="spct">Protein %</label><input id="spct" type="number" inputmode="numeric" min="1" placeholder="30"></div>
    <div class="f"><label for="cpct">Carbs %</label><input id="cpct" type="number" inputmode="numeric" min="1" placeholder="40"></div>
    <div class="f"><label for="fpct">Fat %</label><input id="fpct" type="number" inputmode="numeric" min="1" placeholder="30"></div>
  </div>
  <div class="row">
    <div class="f"><label for="cgoal">Calories (kcal)</label><input id="cgoal" type="number" inputmode="numeric" min="1"></div>
    <div class="f"><label for="pgoal">Protein (g)</label><input id="pgoal" type="number" inputmode="numeric" min="1"></div>
    <div class="f"><label for="kgoal">Carbs (g)</label><input id="kgoal" type="number" inputmode="numeric" min="1"></div>
    <div class="f"><label for="fgoal">Fat (g)</label><input id="fgoal" type="number" inputmode="numeric" min="1"></div>
    <div class="f"><label for="wgoal">Goal weight (lb)</label><input id="wgoal" type="number" inputmode="decimal" step="0.1" min="1"></div>
  </div>
</div>

<div class="card" id="recentCard">
  <div class="f" style="max-width:220px"><label for="rmeal">Add to meal</label><select id="rmeal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select></div>
  <div id="rinfo" class="s" style="margin:8px 0"></div>
  <ul id="rlist"></ul>
</div>

<div class="card" id="acctCard">
  <h3 style="margin:0 0 8px;font-size:15px">Account &amp; cloud backup</h3>
  <div id="acctOut">
    <div class="d" style="margin-bottom:8px">Sign in to back up your data and use it on other devices.</div>
    <div class="row">
      <input id="aem" type="email" autocomplete="email" placeholder="Email" style="flex:1 1 100%">
      <input id="apw" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" style="flex:1 1 100%">
    </div>
    <div class="row" style="margin-top:10px"><button id="asi" style="flex:1">Sign in</button><button id="acr" class="alt" style="flex:1">Create account</button></div>
    <button id="afg" class="ghost u" style="margin-top:6px">Forgot password?</button>
  </div>
  <div id="acctIn" hidden>
    <div>Signed in as <b id="aemail"></b></div>
    <div class="row" style="margin-top:10px"><button id="aso" class="alt" style="flex:1">Sign out</button><button id="adel" class="ghost" style="flex:1">Delete account</button></div>
  </div>
  <div id="amsg" class="d" style="margin-top:8px"></div>
</div>

<div class="card row">
  <button id="exp" class="alt" style="flex:1">Export data</button>
  <label class="alt" style="flex:1;margin:0;text-align:center;padding:10px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);cursor:pointer;font-size:16px;font-weight:600">Import<input id="imp" type="file" accept="application/json" hidden></label>
</div>
</main>

<div id="done" hidden>
  <div class="card" style="max-width:340px;width:100%;text-align:center;margin:0">
    <div id="dmsg" style="font-size:28px;font-weight:700;margin:8px 0"></div>
    <div id="dsub" class="d" style="margin-bottom:14px"></div>
    <button id="dok" style="width:100%">OK</button>
  </div>
</div>

<div id="scan" hidden>
  <video id="vid" playsinline muted></video>
  <div id="sstat">Starting camera…</div>
  <div class="row" style="width:100%;max-width:420px">
    <input id="manual" inputmode="numeric" placeholder="Or type the barcode number">
    <button id="go">Look up</button>
  </div>
  <button id="close" class="alt" style="color:#fff;border-color:#fff">Cancel</button>
</div>

<script>
(function(){
const KEY="weight-meal-tracker-v1",$=id=>document.getElementById(id);
let state={entries:[],meals:{},foods:{}};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&Array.isArray(p.entries))state=Object.assign(state,p);}}catch(e){}
let user=null,pushT=null;
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
const save=()=>{state._u=Date.now();saveLocal();queuePush();};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const r1=x=>Math.round(x*10)/10,fmt=n=>r1(n).toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nkey=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const fdate=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});};
const setMsg=t=>{$("msg").textContent=t;};
$("date").value=$("mdate").value=today();

/* ---------- weight ---------- */
$("addw").onclick=()=>{
  const d=$("date").value,w=parseFloat($("wt").value);
  if(!d||isNaN(w)||w<=0){$("wt").focus();return;}
  const e=state.entries.find(x=>x.date===d);
  if(e)e.weight=w;else state.entries.push({date:d,weight:w});
  save();$("wt").value="";renderWeight();
};
function renderWeight(){
  const a=state.entries.slice().sort((x,y)=>x.date<y.date?-1:1);
  if(!a.length){$("stats").innerHTML='<div class="empty" style="grid-column:1/-1">Add your first weight to get started.</div>';}
  else{
    const cur=a[a.length-1].weight,ch=cur-a[0].weight,l7=a.slice(-7),avg=l7.reduce((s,e)=>s+e.weight,0)/l7.length;
    $("stats").innerHTML=`<div><b>${fmt(cur)}</b><span>Current lb</span></div><div><b>${fmt(avg)}</b><span>Last ${l7.length} avg</span></div><div><b class="${ch>0?"up":ch<0?"down":""}">${ch>0?"+":""}${fmt(ch)}</b><span>Since start</span></div>${state.wGoal?`<div class="d" style="grid-column:1/-1">${fmt(Math.abs(cur-state.wGoal))} lb ${cur>state.wGoal?"to lose":cur<state.wGoal?"to gain":"away"} to reach ${fmt(state.wGoal)} lb</div>`:""}`;
  }
  chart(a);
  const r=a.slice().reverse();
  $("list").innerHTML=r.length?r.map((e,i)=>{const p=r[i+1],c=p?e.weight-p.weight:null;
    return `<li><div><b>${fmt(e.weight)} lb</b>${c!=null?` <span class="${c>0?"up":c<0?"down":"d"}">${c>0?"+":""}${fmt(c)}</span>`:""}<div class="d">${fdate(e.date)}</div></div><button class="ghost" data-w="${e.date}">Delete</button></li>`;}).join(""):'<li class="empty" style="justify-content:center">No weights yet.</li>';
}
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.entries=state.entries.filter(x=>x.date!==b.dataset.w);save();renderWeight();};
function chart(a){
  renderTrends();
  if(a.length<2){$("chart").innerHTML='<div class="empty">Log at least two weights to see a chart.</div>';return;}
  const W=520,H=220,L=40,R=12,T=12,B=26,v=a.map(e=>e.weight);if(state.wGoal)v.push(state.wGoal);
  let mn=Math.min(...v),mx=Math.max(...v);const pad=Math.max((mx-mn)*.15,1);mn-=pad;mx+=pad;
  const t0=new Date(a[0].date).getTime(),sp=Math.max(new Date(a[a.length-1].date).getTime()-t0,1);
  const x=d=>L+(new Date(d).getTime()-t0)/sp*(W-L-R),y=w=>T+(1-(w-mn)/(mx-mn))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">`;
  for(let i=0;i<=3;i++){const val=mn+(mx-mn)*i/3,yy=y(val);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(val)}</text>`;}
  if(state.wGoal){const gy=y(state.wGoal);s+=`<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--good)" stroke-dasharray="5 4"/><text x="${W-R}" y="${gy-4}" text-anchor="end" font-size="11" fill="var(--good)">Goal</text>`;}
  s+=`<polyline points="${a.map(e=>x(e.date).toFixed(1)+","+y(e.weight).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  a.forEach(e=>{s+=`<circle cx="${x(e.date)}" cy="${y(e.weight)}" r="3.5" fill="var(--accent)"/>`;});
  s+=`<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fdate(a[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fdate(a[a.length-1].date)}</text></svg>`;
  $("chart").innerHTML=s;
}

/* ---------- meals ---------- */
const MEALS=[["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snack"]];
function goal(){return state.calGoal>0?state.calGoal:1800;}
function mauto(){const g=goal(),sp=state.sp||30,sc=state.sc||40,sf=state.sf||30,t=sp+sc+sf;return{p:Math.round(g*sp/t/4),c:Math.round(g*sc/t/4),f:Math.round(g*sf/t/9)};}
function mgoal(){const a=mauto();return{p:state.pGoal||a.p,c:state.cGoal||a.c,f:state.fGoal||a.f};}
function renderMeals(){
  const GOAL=goal(),M=mgoal(),mg=(v,g)=>Math.round(v)+(g?"/"+g:"")+"g",d=$("mdate").value,m=state.meals[d]||{};let h="",tot=0,P=0,C=0,F=0;
  MEALS.forEach(([k,label])=>{
    const items=m[k]||[];let sub=0;
    items.forEach(o=>{sub+=o.cal||0;P+=o.p||0;C+=o.c||0;F+=o.f||0;});
    tot+=sub;
    h+=`<div class="meal"><h3>${label}${sub?` <span class="d">· ${Math.round(sub)} kcal</span>`:""}</h3><ul>`;
    items.forEach((o,i)=>{
      const mac=o.p!=null?`<div class="s">P ${Math.round(o.p)}g · C ${Math.round(o.c||0)}g · F ${Math.round(o.f||0)}g</div>`:"";
      h+=`<li><span>${esc(o.t)}${mac}</span><span class="d r"><button class="ghost u" data-e="${k}:${i}">${o.cal!=null?Math.round(o.cal)+" kcal":"+ kcal"}</button><button class="ghost" data-x="${k}:${i}">Remove</button></span></li>`;
    });
    if(!items.length)h+='<li class="d">Nothing logged</li>';
    h+="</ul></div>";
  });
  tot=Math.round(tot);const left=GOAL-tot;
  $("meals").innerHTML=`<div class="d" style="margin-top:12px">Total: <b>${tot} kcal</b> · ${left>=0?left+" left":`<span class="up">${-left} over</span>`} of ${GOAL}<div class="s">P ${mg(P,M.p)} · C ${mg(C,M.c)} · F ${mg(F,M.f)}</div></div><div class="bar"><i style="width:${Math.min(100,tot/GOAL*100)}%;background:var(${tot>GOAL?"--bad":"--accent"})"></i></div>`+h;
  $("known").innerHTML=Object.values(state.foods).map(f=>`<option value="${esc(f.n)}">`).join("");
  renderRecent();renderTrends();
}
$("mdate").onchange=renderMeals;

/* remembered foods: pick a known name and the values fill in */
let base=null; /* values for 1 serving */
function setFields(b,q){
  $("fcal").value=b.cal==null?"":Math.round(b.cal*q);
  $("fp").value=b.p==null?"":r1(b.p*q);$("fc").value=b.c==null?"":r1(b.c*q);$("ff").value=b.f==null?"":r1(b.f*q);
}
function readBase(){
  const q=parseFloat($("fqty").value)||1,g=id=>{const x=parseFloat($(id).value);return isNaN(x)?null:x/q;};
  base={cal:g("fcal"),p:g("fp"),c:g("fc"),f:g("ff")};
}
["fcal","fp","fc","ff"].forEach(id=>$(id).addEventListener("input",readBase));
$("fqty").addEventListener("input",()=>{
  const q=parseFloat($("fqty").value);if(!(q>0))return;
  if(!base){const f=state.foods[nkey($("fname").value)];if(f)base={cal:f.cal,p:f.p,c:f.c,f:f.f};}
  if(base)setFields(base,q);
});
$("fname").onchange=()=>{
  const f=state.foods[nkey($("fname").value)];
  if(f&&$("fcal").value===""){base={cal:f.cal,p:f.p,c:f.c,f:f.f};setFields(base,parseFloat($("fqty").value)||1);setMsg("Filled from your saved values for this food.");}
};
$("add").onclick=()=>{
  const t=$("fname").value.trim();if(!t)return;
  const num=id=>{const x=parseFloat($(id).value);return isNaN(x)?null:x;},q=num("fqty")||1,k=nkey(t),known=state.foods[k];
  let cal=num("fcal"),p=num("fp"),c=num("fc"),f=num("ff");
  if(cal==null&&known){cal=known.cal*q;p=known.p==null?null:known.p*q;c=known.c==null?null:known.c*q;f=known.f==null?null:known.f*q;}
  else if(cal!=null){const u=x=>x==null?null:x/q;state.foods[k]={n:t,cal:u(cal),p:u(p),c:u(c),f:u(f)};}
  const sc=x=>x==null?null:r1(x),d=$("mdate").value;
  const item={t:q!==1?`${t} ×${q}`:t,k,q,cal:cal==null?null:Math.round(cal),p:sc(p),c:sc(c),f:sc(f)};
  ((state.meals[d]=state.meals[d]||{})[$("meal").value]=state.meals[d][$("meal").value]||[]).push(item);
  save();["fname","fcal","fp","fc","ff"].forEach(id=>$(id).value="");$("fqty").value=1;base=null;setMsg("");renderMeals();
};
$("meals").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;const d=$("mdate").value;
  if(b.dataset.x){const[k,i]=b.dataset.x.split(":");state.meals[d][k].splice(+i,1);}
  else if(b.dataset.e){
    const[k,i]=b.dataset.e.split(":"),o=state.meals[d][k][+i],v=parseFloat(prompt("Calories for "+o.t,o.cal??""));
    if(isNaN(v))return;o.cal=Math.round(v);
    if(o.k)state.foods[o.k]=Object.assign({n:o.t},state.foods[o.k],{cal:v/(o.q||1)}); /* remembered for next time */
  }else return;
  save();renderMeals();
};

/* ---------- trends ---------- */
function renderTrends(){
  const G=goal(),days=[];
  for(let i=13;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
    const k=dt.toISOString().slice(0,10),m=state.meals[k]||{};let c=0,has=false;
    for(const x in m)(m[x]||[]).forEach(o=>{c+=o.cal||0;has=true;});
    days.push({k,c:Math.round(c),has});
  }
  const wk=days.slice(7),pw=days.slice(0,7);
  const avg=a=>{const l=a.filter(d=>d.has);return l.length?Math.round(l.reduce((s,d)=>s+d.c,0)/l.length):null;};
  const wa=a=>{const ks=a.map(d=>d.k),l=state.entries.filter(e=>ks.includes(e.date));return l.length?l.reduce((s,e)=>s+e.weight,0)/l.length:null;};
  const a1=avg(wk),a0=avg(pw),w1=wa(wk),w0=wa(pw);
  const W=520,H=140,L=8,R=8,T=10,B=22,mx=Math.max(G*1.15,...days.map(d=>d.c)),bw=(W-L-R)/14;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">`;
  days.forEach((d,i)=>{
    const h=d.c/mx*(H-T-B),x=L+i*bw+3;
    s+=`<rect x="${x}" y="${H-B-h}" width="${bw-6}" height="${h}" rx="3" fill="${d.c>G?"var(--bad)":"var(--accent)"}" opacity="${d.has?1:.25}"/><text x="${x+(bw-6)/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${+d.k.slice(8)}</text>`;
  });
  const gy=H-B-G/mx*(H-T-B);
  s+=`<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--good)" stroke-dasharray="5 4"/></svg>`;
  const dw=w1!=null&&w0!=null?w1-w0:null;
  $("trends").innerHTML=`<div class="stats"><div><b>${a1??"–"}</b><span>Avg kcal, last 7 days</span></div><div><b>${a0??"–"}</b><span>Avg kcal, week before</span></div><div><b class="${dw>0?"up":dw<0?"down":""}">${dw!=null?(dw>0?"+":"")+fmt(dw):"–"}</b><span>Avg weight change (lb)</span></div></div><div class="d" style="margin:10px 0 4px">Calories per day, last 14 days (faded = nothing logged)</div>`+s;
}

/* ---------- quick re-add ---------- */
let rec=[];
function renderRecent(){
  const seen=new Set();rec=[];
  Object.keys(state.meals).sort().reverse().forEach(d=>MEALS.forEach(([k])=>(state.meals[d][k]||[]).forEach(o=>{if(o.k&&!seen.has(o.k)&&rec.length<50){seen.add(o.k);rec.push(o);}})));
  const mealName=(MEALS.find(([k])=>k===$("meal").value)||[,""])[1];
  $("rmeal").value=$("meal").value;
  $("rinfo").textContent="Tap Add to put a food in "+mealName+" on "+fdate($("mdate").value)+".";
  $("rlist").innerHTML=rec.length?rec.map((o,i)=>{
    const sf=state.foods[o.k],f=sf||o,n=sf?sf.n:o.t;
    return `<li><div><b>${esc(n)}</b><div class="s">${f.cal!=null?Math.round(f.cal)+" kcal":""}${f.p!=null?` · P ${Math.round(f.p)}g · C ${Math.round(f.c||0)}g · F ${Math.round(f.f||0)}g`:""}</div></div><button style="padding:6px 14px" data-r="${i}">Add</button></li>`;
  }).join(""):'<li class="empty" style="justify-content:center">No recent foods yet.</li>';
}
$("recentBtn").onclick=()=>{location.hash="recent";};
$("rmeal").onchange=()=>{$("meal").value=$("rmeal").value;renderRecent();};
$("rlist").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const o=rec[+b.dataset.r],f=state.foods[o.k],d=$("mdate").value,m=$("meal").value;
  const it=f?{t:f.n,k:o.k,q:1,cal:f.cal==null?null:Math.round(f.cal),p:f.p,c:f.c,f:f.f}:Object.assign({},o);
  ((state.meals[d]=state.meals[d]||{})[m]=state.meals[d][m]||[]).push(it);save();renderMeals();
  const lab=(MEALS.find(x=>x[0]===m)||[0,m])[1];$("rinfo").textContent="Added "+it.t+" to "+lab+" on "+fdate(d)+".";
};
$("copy").onclick=()=>{
  const d=$("mdate").value,p=new Date(d+"T00:00");p.setDate(p.getDate()-1);p.setMinutes(p.getMinutes()-p.getTimezoneOffset());
  const pk=p.toISOString().slice(0,10),src=state.meals[pk];
  if(!src||!MEALS.some(([k])=>(src[k]||[]).length)){setMsg("Nothing logged on the previous day ("+fdate(pk)+").");return;}
  const dst=state.meals[d]=state.meals[d]||{};
  MEALS.forEach(([k])=>(src[k]||[]).forEach(o=>(dst[k]=dst[k]||[]).push(Object.assign({},o))));
  save();setMsg("Copied meals from "+fdate(pk)+".");renderMeals();
};

let fb=null;
const amsg=t=>{$("amsg").textContent=t;};
const setSync=t=>{if(user)amsg(t);};
const hasData=s=>!!((s.entries&&s.entries.length)||(s.meals&&Object.keys(s.meals).length)||(s.foods&&Object.keys(s.foods).length));
function errText(e){
  const c=(e&&e.code)||"";
  return c.includes("invalid-email")?"That email doesn’t look right."
    :c.includes("weak-password")?"Use a password with at least 6 characters."
    :c.includes("email-already-in-use")?"That email already has an account. Try Sign in."
    :(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))?"Email or password is incorrect."
    :c.includes("too-many-requests")?"Too many tries. Wait a bit and try again."
    :c.includes("network")?"No connection. Try again when you’re online."
    :"Something went wrong. Try again.";
}
async function fbInit(){
  if(fb)return fb;
  const b="https://www.gstatic.com/firebasejs/10.14.1/";
  const [app,auth,fs]=await Promise.all([import(b+"firebase-app.js"),import(b+"firebase-auth.js"),import(b+"firebase-firestore.js")]);
  const a=app.initializeApp(FB_CONFIG);
  fb={auth,fs,A:auth.getAuth(a),D:fs.getFirestore(a)};
  return fb;
}
function renderAccount(){
  $("acctOut").hidden=!!user;$("acctIn").hidden=!user;
  if(user)$("aemail").textContent=user.email||"";
}
function queuePush(){if(!user)return;clearTimeout(pushT);setSync("Saving…");pushT=setTimeout(push,1500);}
async function push(){
  if(!user||!fb)return;
  try{
    state._uid=user.uid;saveLocal();
    await fb.fs.setDoc(fb.fs.doc(fb.D,"users",user.uid),{data:JSON.stringify(state),updated:state._u||Date.now()});
    setSync("Backed up "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
  }catch(e){setSync("Couldn’t back up. It will retry when you’re online.");}
}
async function onUser(u){
  user=u;renderAccount();
  if(!u)return;
  setSync("Syncing…");
  try{
    const snap=await fb.fs.getDoc(fb.fs.doc(fb.D,"users",u.uid));
    let cloud=null;
    if(snap.exists()){try{cloud=JSON.parse(snap.data().data);}catch(e){}}
    if(cloud&&Array.isArray(cloud.entries)){
      let useCloud=true;
      if(state._uid===u.uid)useCloud=(cloud._u||0)>(state._u||0);
      else if(!state._uid&&hasData(state))useCloud=confirm("This device already has data that isn’t in your account. OK replaces it with your account’s saved data. Cancel keeps this device’s data and replaces the account’s.");
      if(useCloud){
        state=Object.assign({entries:[],meals:{},foods:{}},cloud);state._uid=u.uid;saveLocal();
        loadSet();renderWeight();renderMeals();setSync("Backed up and up to date");return;
      }
    }else if(state._uid&&state._uid!==u.uid){
      state={entries:[],meals:{},foods:{}};loadSet();renderWeight();renderMeals();
    }
    state._uid=u.uid;saveLocal();await push();
  }catch(e){setSync("Couldn’t reach your account. Using this device’s data.");}
}
async function authDo(kind){
  const em=$("aem").value.trim(),pw=$("apw").value;
  if(!em||!pw){amsg("Enter your email and password.");return;}
  amsg("Working…");
  try{
    const f=await fbInit();
    if(kind==="in")await f.auth.signInWithEmailAndPassword(f.A,em,pw);
    else await f.auth.createUserWithEmailAndPassword(f.A,em,pw);
    $("apw").value="";
  }catch(e){amsg(errText(e));}
}
$("asi").onclick=()=>authDo("in");
$("acr").onclick=()=>authDo("up");
$("afg").onclick=async()=>{
  const em=$("aem").value.trim();if(!em){amsg("Enter your email above first.");return;}
  try{const f=await fbInit();await f.auth.sendPasswordResetEmail(f.A,em);amsg("If that email has an account, a reset link is on its way.");}
  catch(e){amsg(errText(e));}
};
$("aso").onclick=async()=>{try{await fb.auth.signOut(fb.A);amsg("Signed out. Your data stays on this device.");}catch(e){amsg(errText(e));}};
$("adel").onclick=async()=>{
  if(!user||!confirm("Delete your account and cloud backup? Data on this device stays. This can’t be undone."))return;
  try{
    await fb.fs.deleteDoc(fb.fs.doc(fb.D,"users",user.uid));
    await fb.auth.deleteUser(user);
    delete state._uid;saveLocal();amsg("Account deleted.");
  }catch(e){amsg((e&&e.code||"").includes("requires-recent-login")?"For safety, sign out, sign in again, then delete.":errText(e));}
};
window.addEventListener("online",()=>{if(user)push();});
fbInit().then(f=>f.auth.onAuthStateChanged(f.A,onUser)).catch(()=>{});

/* ---------- done for the day ---------- */
$("dayDone").onclick=()=>{
  const m=state.meals[$("mdate").value]||{},G=goal();let tot=0,n=0;
  MEALS.forEach(([k])=>(m[k]||[]).forEach(o=>{tot+=o.cal||0;n++;}));
  tot=Math.round(tot);const diff=tot-G;let msg,sub;
  if(!n){msg="Nothing logged yet";sub="Add your meals first, then tap Done for the day.";}
  else{
    msg=diff<0?"Way to go!":diff<100?"Stay locked in!":"Do better!";
    sub=tot+" of "+G+" kcal · "+(diff<0?(-diff)+" under":diff===0?"right on goal":diff+" over");
  }
  $("dmsg").textContent=msg;$("dsub").textContent=sub;$("done").hidden=false;
};
$("dok").onclick=()=>{$("done").hidden=true;};
$("done").onclick=e=>{if(e.target===$("done"))$("done").hidden=true;};

/* ---------- barcode scanning ---------- */
let stream=null,zr=null,scanning=false;
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s);});
function stopCam(){
  scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  if(zr){try{zr.reset();}catch(e){}zr=null;}
  $("vid").srcObject=null;
}
function closeScan(){stopCam();$("scan").hidden=true;}
async function openScan(){
  $("scan").hidden=false;$("sstat").textContent="Starting camera…";
  const v=$("vid");
  try{
    let det=null;
    if("BarcodeDetector" in window){
      try{
        const have=await BarcodeDetector.getSupportedFormats(),use=["ean_13","ean_8","upc_a","upc_e"].filter(f=>have.includes(f));
        if(use.length)det=new BarcodeDetector({formats:use});
      }catch(e){det=null;}
    }
    if(det){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
      v.srcObject=stream;await v.play();scanning=true;$("sstat").textContent="Point at a barcode";
      (async()=>{while(scanning){try{const r=await det.detect(v);if(r.length){found(r[0].rawValue);return;}}catch(e){}await new Promise(ok=>setTimeout(ok,200));}})();
    }else{
      await loadZX();zr=new ZXing.BrowserMultiFormatReader();scanning=true;
      await zr.decodeFromVideoDevice(null,"vid",res=>{if(res&&scanning)found(res.getText());});
      $("sstat").textContent="Point at a barcode";
    }
  }catch(e){
    stopCam();
    $("sstat").textContent=e&&e.name==="NotAllowedError"?"Camera access was blocked. Allow it in your browser settings, or type the barcode below.":"Camera unavailable. Type the barcode below.";
  }
}
async function found(code){closeScan();await lookup(code);}
async function lookup(code){
  code=String(code).replace(/\D/g,"");if(!code)return;
  setMsg("Looking up "+code+"…");
  const tries=[code];
  if(code.length===12)tries.push("0"+code);
  if(code.length===13&&code[0]==="0")tries.push(code.slice(1));
  try{
    let p=null;
    for(const c of tries){
      const res=await fetch("https://world.openfoodfacts.org/api/v2/product/"+c+".json?fields=product_name,brands,serving_size,nutriments"),j=await res.json();
      if(j.status===1&&j.product){p=j.product;break;}
    }
    if(!p){setMsg("Not found in Open Food Facts. Enter it manually.");$("fname").focus();return;}
    const n=p.nutriments||{};
    const kcalOf=s=>n["energy-kcal"+s]!=null?Number(n["energy-kcal"+s]):(n["energy"+s]!=null?Number(n["energy"+s])/4.184:NaN);
    const sv=isFinite(kcalOf("_serving")),sfx=sv?"_serving":"_100g",kc=kcalOf(sfx);
    const g=k=>{const x=Number(n[k+sfx]);return n[k+sfx]==null||!isFinite(x)?"":r1(x);};
    const name=[p.brands&&p.brands.split(",")[0].trim(),p.product_name].filter(Boolean).join(" ")||code;
    $("fname").value=name;
    $("fcal").value=isFinite(kc)?Math.round(kc):"";
    $("fp").value=g("proteins");$("fc").value=g("carbohydrates");$("ff").value=g("fat");$("fqty").value=1;readBase();
    if(!isFinite(kc)){setMsg("Found "+name+", but it has no calorie info. Enter it manually.");$("fcal").focus();return;}
    setMsg("Filled per "+(sv?"serving"+(p.serving_size?" ("+p.serving_size+")":""):"100 g")+". Adjust Servings if you had more or less"+(sv?"":" (1 = 100 g)")+", then tap Add food.");
  }catch(e){setMsg("Lookup failed (offline?). Enter it manually.");}
}
$("scanbtn").onclick=openScan;$("close").onclick=closeScan;
$("go").onclick=()=>{const c=$("manual").value;$("manual").value="";closeScan();lookup(c);};
